# yamllint config (also used by orb-tools/lint in CI).
extends: default
rules:
  document-start: disable
  line-length:
    max: 140
    allow-non-breakable-inline-mappings: true
  truthy:
    allowed-values: ["true", "false", "on"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  indentation:
    spaces: 2
    indent-sequences: consistent
ignore: |
  orb.yml
  coverage/
