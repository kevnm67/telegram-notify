# telegram-notify orb — lint/pack/test pipeline (CircleCI Orb Development Kit).
#
# This is a *setup* workflow: once lint, review, shellcheck and the unit
# tests pass, orb-tools/continue injects the packed orb into
# .circleci/test-deploy.yml, which runs the integration tests and publishes.
#
# Orb versions verified 2026-08-22 via `circleci orb info`:
#   circleci/orb-tools 12.5.0, circleci/shellcheck 3.4.0, qltysh/qlty-orb 0.1.2
version: 2.1
setup: true

# Manual dogfooding: trigger with {"parameters": {"live_test": true}} to run the
# published dev orb against the real Telegram API (context ci_notify).
parameters:
  live_test:
    type: boolean
    default: false

orbs:
  orb-tools: circleci/orb-tools@12.5.0
  shellcheck: circleci/shellcheck@3.4.0
  qlty: qltysh/qlty-orb@0.1.2
  # Consumes the last dev publish of THIS orb (renovate: ignore — dev tag, not semver).
  telegram-notify: kevnm67/telegram-notify@dev:alpha

filters: &filters
  tags:
    only: /.*/

jobs:
  unit_tests:
    docker:
      # Ubuntu 22.04 ships kcov in apt (24.04 dropped it); see install-test-tools.sh.
      - image: cimg/base:current-22.04
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install bats + kcov
          command: ./scripts/ci/install-test-tools.sh
      - run:
          name: Unit tests with coverage
          command: timeout 600 ./scripts/ci/run-unit-tests.sh --coverage --junit-dir test-results
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: coverage/bats
          destination: coverage
      # kcov's Cobertura lists files relative to src/scripts; qlty needs repo-relative paths.
      - qlty/coverage_publish:
          format: cobertura
          files: coverage/bats/cobertura.xml
          add_prefix: src/scripts

  unit_tests_bash32:
    # macOS executors ship bash 3.2; this Alpine image also lacks jq and python3,
    # so it exercises every grep/sed/awk fallback path.
    docker:
      - image: bash:5.3
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install git, curl and bats
          command: ./scripts/ci/install-test-tools.sh --minimal
      - run:
          name: Unit tests on bash 3.2 (no jq, no python3)
          command: timeout 600 ./scripts/ci/run-unit-tests.sh --junit-dir test-results
      - store_test_results:
          path: test-results

  live_success:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - checkout
      - run:
          name: Pretend to build
          command: echo "build ok"
      - telegram-notify/notify_success:
          custom_message: "<i>live test: notify_success via @dev:alpha</i>"
          silent: true
          fail_on_error: true

  live_failure:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - checkout
      - run:
          name: Fail on purpose
          command: ./scripts/ci/fail-on-purpose.sh
      - telegram-notify/notify_failure:
          custom_message: "<i>live test: notify_failure via @dev:alpha (expected red job)</i>"
          max_lines: 10
          mentions: "@kevnm67"
          attach_log: true

  live_ai_summary:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - checkout
      - run:
          name: Fail on purpose
          command: ./scripts/ci/fail-on-purpose.sh
      - telegram-notify/notify_failure:
          template: ai_summary
          custom_message: "<i>live test: template ai_summary (expected red job)</i>"
          max_lines: 10

  live_test_summary:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - checkout
      - run:
          name: Produce JUnit results with one failure
          command: ./scripts/ci/write-sample-junit.sh test-results
      - store_test_results:
          path: test-results
      - telegram-notify/notify:
          event: always
          template: test_summary
          custom_message: "<i>live test: template test_summary</i>"

  live_insights:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - checkout
      - telegram-notify/notify_success:
          template: insights
          insights_window: last-30-days
          custom_message: "<i>live test: template insights</i>"
          silent: true

  live_custom:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - checkout
      - telegram-notify/notify_success:
          template: custom
          custom_body: >-
            🧪 <b>{{CIRCLE_JOB}}</b> finished on <code>{{CIRCLE_BRANCH}}</code>
            by {{CIRCLE_USERNAME}} — <i>live test: template custom</i>
          buttons: false
          silent: true

workflows:
  live_test:
    when: << pipeline.parameters.live_test >>
    jobs:
      - live_success:
          context: ci_notify
      - live_failure:
          context: ci_notify
      - live_ai_summary:
          context: ci_notify
      - live_test_summary:
          context: ci_notify
      - live_insights:
          context: ci_notify
      - live_custom:
          context: ci_notify
      - live_success:
          name: live_always_post_step
          context: ci_notify
          post-steps:
            - telegram-notify/notify:
                event: always
                custom_message: "<i>live test: event=always as a post-step</i>"
                include_links: false
                fail_on_error: true

  lint_pack_test:
    when:
      not: << pipeline.parameters.live_test >>
    jobs:
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          orb_name: telegram-notify
          filters: *filters
      - shellcheck/check:
          dir: .
          filters: *filters
      - unit_tests:
          context: qlty-credentials
          filters: *filters
      - unit_tests_bash32:
          filters: *filters
      - orb-tools/continue:
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          orb_name: telegram-notify
          requires:
            - orb-tools/lint
            - orb-tools/pack
            - orb-tools/review
            - shellcheck/check
            - unit_tests
            - unit_tests_bash32
          filters: *filters
