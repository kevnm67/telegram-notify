description: "Send Telegram notification on CI failure with error details"

parameters:
  chat_id:
    type: string
    description: "Telegram chat ID to send notification to"
  max_lines:
    type: integer
    description: "Maximum lines of error output to include in message"
    default: 50
  include_log_link:
    type: boolean
    description: "Include link to full build logs"
    default: true

steps:
  - run:
      name: "Send CI Failure Notification"
      command: |
        << include(scripts/notify-failure.sh) >>
      environment:
        NOTIFY_CHAT_ID: << parameters.chat_id >>
        NOTIFY_MAX_LINES: << parameters.max_lines >>
        NOTIFY_INCLUDE_LOG_LINK: << parameters.include_log_link >>
      when: on_fail